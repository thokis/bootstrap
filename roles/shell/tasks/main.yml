---
- name: Clone oh-my-bash
  ansible.builtin.git:
    repo: "{{ shell_omb_repo }}"
    dest: "{{ shell_omb_dir }}"
    version: master
    recursive: false
    update: false   # don't clobber the framework on every run; just ensure present

- name: Deploy the custom oh-my-bash overlay
  ansible.builtin.copy:
    src: omb-custom/
    dest: "{{ shell_omb_dir }}/custom/"
    mode: preserve

- name: Deploy .profile
  ansible.builtin.copy:
    src: profile
    dest: "{{ ansible_facts.env.HOME }}/.profile"
    mode: "0644"

- name: Deploy .bashrc
  ansible.builtin.copy:
    src: bashrc
    dest: "{{ ansible_facts.env.HOME }}/.bashrc"
    mode: "0644"

# Machine-local overrides + secrets live here, sourced by .bashrc. Never managed
# or committed — create it empty once, never overwrite an existing one.
- name: Ensure ~/.bashrc.local exists
  ansible.builtin.copy:
    content: "# Machine-local shell config and secrets. Gitignored, not managed.\n"
    dest: "{{ ansible_facts.env.HOME }}/.bashrc.local"
    mode: "0600"
    force: false

# nnn as default file manager: nnn-open runs the omb `n` function in an
# interactive bash so desktop launches get the same flags and NNN_* env.
- name: Ensure the local bin and applications directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ shell_local_bin }}"
    - "{{ ansible_facts.env.HOME }}/.local/share/applications"

- name: Deploy the nnn launcher
  ansible.builtin.copy:
    src: nnn-open
    dest: "{{ shell_local_bin }}/nnn-open"
    mode: "0755"

- name: Deploy the nnn desktop entry
  ansible.builtin.copy:
    src: nnn.desktop
    dest: "{{ ansible_facts.env.HOME }}/.local/share/applications/nnn.desktop"
    mode: "0644"

- name: Set nnn as the default file manager in mimeapps.list
  community.general.ini_file:
    path: "{{ ansible_facts.env.HOME }}/.config/mimeapps.list"
    section: Default Applications
    option: inode/directory
    value: nnn.desktop
    no_extra_spaces: true
    create: true
    mode: "0644"
