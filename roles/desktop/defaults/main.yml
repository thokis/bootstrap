---
desktop_local_bin: "{{ ansible_facts.env.HOME }}/.local/bin"

# Wallpaper feh restores in .xinitrc (provide the image yourself).
desktop_wallpaper: "{{ ansible_facts.env.HOME }}/Pictures/wallhaven-5y3pd8.png"

# CaskaydiaCove Nerd Font (st/dwm/dmenu primary font).
desktop_font_version: v3.5.1
desktop_font_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ desktop_font_version }}/CascadiaCode.zip"
desktop_font_dir: "{{ ansible_facts.env.HOME }}/.local/share/fonts/CascadiaCode"

# Runtime tools the session and its scripts call.
desktop_packages:
    - unzip # extract the font archive
    - scrot # screenshot + lockscreen snapshot
    - imagemagick # lockscreen blur (convert)
    - feh # wallpaper + default image viewer
    - picom # compositor
    - libpam-gnome-keyring # unlock keyring (ssh keys, NM/wifi secrets) at tty login
    - xss-lock # lock on suspend / lock-session
    - xprintidle # idle-manager
    - brightnessctl # idle-manager backlight + dwm brightness keys
    - pamixer # dwm volume keys (XF86AudioRaise/Lower/Mute)
    - playerctl # dwm media transport keys (XF86AudioPlay/Pause/Next/Prev) via MPRIS
    - iw # netstatus wifi essid
    - x11-xserver-utils # xrdb, xsetroot

# Personal helper scripts deployed to ~/.local/bin (mode 0755).
desktop_scripts:
    - lockscreen
    - idle-manager
    - netstatus
    - google-chrome
    - screenshot

# Default image viewer in mimeapps.list (xdg-open, so nnn's Enter too).
desktop_image_viewer: feh.desktop
desktop_image_mimes:
    - image/jpeg
    - image/png
    - image/gif
    - image/tiff
    - image/bmp
    - image/webp
    - image/x-icon
    - image/x-xpixmap
    - image/x-xbitmap
