---
- name: Install session packages
  ansible.builtin.apt:
      name: "{{ desktop_packages }}"
      state: present
  become: true

# The amdgpu backlight sysfs node is root:video g+w, so brightnessctl can only
# set brightness for members of the video group. Without this the dwm
# XF86MonBrightness keys fire but silently fail on "Permission denied".
- name: Grant the session user backlight write access via the video group
  ansible.builtin.user:
      name: "{{ ansible_user_id }}"
      groups: video
      append: true
  become: true

- name: Ensure the local bin directory exists
  ansible.builtin.file:
      path: "{{ desktop_local_bin }}"
      state: directory
      mode: "0755"

- name: Deploy helper scripts
  ansible.builtin.copy:
      src: "{{ item }}"
      dest: "{{ desktop_local_bin }}/{{ item }}"
      mode: "0755"
  loop: "{{ desktop_scripts }}"

- name: Deploy X resources
  ansible.builtin.copy:
      src: Xresources
      dest: "{{ ansible_env.HOME }}/.Xresources"
      mode: "0644"

- name: Deploy the .xinitrc
  ansible.builtin.template:
      src: xinitrc.j2
      dest: "{{ ansible_env.HOME }}/.xinitrc"
      mode: "0755"

- name: Ensure config subdirectories exist
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: "0755"
  loop:
      - "{{ ansible_env.HOME }}/.config"
      - "{{ ansible_env.HOME }}/.config/xdg-desktop-portal"
      - "{{ ansible_env.HOME }}/.icons/default"

- name: Deploy the picom configuration
  ansible.builtin.copy:
      src: picom.conf
      dest: "{{ ansible_env.HOME }}/.config/picom.conf"
      mode: "0644"

- name: Force the GTK xdg-desktop-portal backend
  ansible.builtin.copy:
      src: portals.conf
      dest: "{{ ansible_env.HOME }}/.config/xdg-desktop-portal/portals.conf"
      mode: "0644"

- name: Inherit the Adwaita cursor theme
  ansible.builtin.copy:
      src: icons-default-index.theme
      dest: "{{ ansible_env.HOME }}/.icons/default/index.theme"
      mode: "0644"

- name: Configure touchpad tap-to-click and natural scrolling
  ansible.builtin.copy:
      src: 40-libinput-touchpad.conf
      dest: /etc/X11/xorg.conf.d/40-libinput-touchpad.conf
      mode: "0644"
  become: true

- name: Ensure the font directory exists
  ansible.builtin.file:
      path: "{{ desktop_font_dir }}"
      state: directory
      mode: "0755"

- name: Install the CaskaydiaCove Nerd Font
  ansible.builtin.unarchive:
      src: "{{ desktop_font_url }}"
      dest: "{{ desktop_font_dir }}"
      remote_src: true
      creates: "{{ desktop_font_dir }}/CaskaydiaCoveNerdFont-Regular.ttf"
  notify: Rebuild font cache

# Auto-unlock the login keyring with the tty login password, so gcr-ssh-agent
# (ssh keys), NetworkManager (wifi secrets) and the Secret Service work without
# a separate unlock prompt. The dwm session logs in on a tty, not a display
# manager, so the anchor is /etc/pam.d/login.
- name: Unlock the gnome-keyring at tty login (auth)
  ansible.builtin.lineinfile:
      path: /etc/pam.d/login
      regexp: '^auth\s+optional\s+pam_gnome_keyring\.so\s*$'
      line: "auth       optional   pam_gnome_keyring.so"
      insertafter: "^@include common-auth"
  become: true

- name: Start the gnome-keyring for the tty session (session)
  ansible.builtin.lineinfile:
      path: /etc/pam.d/login
      regexp: '^session\s+optional\s+pam_gnome_keyring\.so\s+auto_start\s*$'
      line: "session    optional   pam_gnome_keyring.so auto_start"
      insertafter: "^@include common-session"
  become: true
