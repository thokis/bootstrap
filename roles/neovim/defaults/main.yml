---
neovim_bin: /usr/local/bin/nvim
neovim_repo: https://github.com/neovim/neovim.git
neovim_version: stable
neovim_src: "{{ ansible_facts.env.HOME }}/.sources/neovim"

neovim_config_repo: https://github.com/thokis/kickstart.nvim.git
neovim_config_version: master
neovim_config_dir: "{{ ansible_facts.env.HOME }}/.config/nvim"

neovim_packages:
  - build-essential   # neovim build
  - ninja-build       # neovim build
  - gettext           # neovim build
  - cmake             # neovim build
  - unzip             # neovim build
  - curl              # neovim build
  - ripgrep           # telescope live grep
  - fd-find           # telescope file finding

neovim_default_apps:
  - {mime: text/plain, app: nvim.desktop}
