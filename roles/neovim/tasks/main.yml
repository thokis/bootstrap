---
- name: Install neovim build and runtime dependencies
  ansible.builtin.apt:
    name: "{{ neovim_packages }}"
    state: present
  become: true

# Note: `stable` is a tag neovim force-moves on each release. A plain fetch
# gets it on first clone; to pick up a newer stable on an existing checkout,
# bump neovim_version to the release tag (e.g. v0.11.6) or delete the
# local `stable` tag first.
- name: Clone or update the neovim source (stable)
  ansible.builtin.git:
    repo: "{{ neovim_repo }}"
    dest: "{{ neovim_src }}"
    version: "{{ neovim_version }}"
    force: true   # neovim force-moves the nightly/stable tags; allow clobbering
  register: neovim_git

- name: Check whether neovim is installed
  ansible.builtin.stat:
    path: "{{ neovim_bin }}"
  register: neovim_binary

# Gate on the checked-out commit actually changing (before != after), not on
# git.changed — force:true reports changed every run because neovim's nightly
# tag always moves, which would otherwise rebuild neovim needlessly.
- name: Clean the previous neovim build on version change
  community.general.make:
    chdir: "{{ neovim_src }}"
    target: distclean
  when:
    - neovim_git.before is not none
    - neovim_git.before != neovim_git.after
    - neovim_binary.stat.exists

- name: Build neovim
  community.general.make:
    chdir: "{{ neovim_src }}"
    params:
      CMAKE_BUILD_TYPE: RelWithDebInfo
  when: neovim_git.before != neovim_git.after or not neovim_binary.stat.exists

- name: Install neovim
  community.general.make:
    chdir: "{{ neovim_src }}"
    target: install
  become: true
  when: neovim_git.before != neovim_git.after or not neovim_binary.stat.exists

- name: Clone or update the neovim config fork
  ansible.builtin.git:
    repo: "{{ neovim_config_repo }}"
    dest: "{{ neovim_config_dir }}"
    version: "{{ neovim_config_version }}"
    force: true   # fork is source of truth; discard local drift (e.g. lazy-lock)

- name: Set neovim as the default editor (update-alternatives)
  community.general.alternatives:
    name: editor
    path: "{{ neovim_bin }}"
  become: true

# nvim.desktop is Terminal=true, so opening a text file is hosted by whatever the
# st role's xdg-terminal-exec keystone resolves (st).
- name: Set default text editor in mimeapps.list
  community.general.ini_file:
    path: "{{ ansible_facts.env.HOME }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item.mime }}"
    value: "{{ item.app }}"
    no_extra_spaces: true
    create: true
    mode: "0644"
  loop: "{{ neovim_default_apps }}"
