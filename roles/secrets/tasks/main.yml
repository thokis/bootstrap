---
# hvac (for the community.hashi_vault lookup) is a declared control-node dep in
# pyproject.toml — run the playbook inside the uv env (`uv run ansible-playbook`
# or `uv sync` + activated .venv). AppRole auth + address come from the
# environment (ANSIBLE_HASHI_VAULT_*), loaded by `source scripts/load-creds.sh`.
- name: Ensure the ~/.ssh directory exists
  ansible.builtin.file:
      path: "{{ ansible_env.HOME }}/.ssh"
      state: directory
      mode: "0700"

- name: Fetch the GitHub SSH key from OpenBao
  ansible.builtin.set_fact:
      secrets_github_private_key: >-
          {{ lookup('community.hashi_vault.vault_kv2_get', secrets_ssh_key_path,
                    engine_mount_point=secrets_kv_mount)['secret'][secrets_ssh_key_field] }}
  no_log: true

- name: Install the GitHub SSH private key
  ansible.builtin.copy:
      content: "{{ secrets_github_private_key }}"
      dest: "{{ secrets_ssh_key_dest }}"
      mode: "0600"
  no_log: true

# The key is installed under a non-default filename, so ssh won't pick it up on
# its own — point github.com at it explicitly.
- name: Use the GitHub key for github.com
  ansible.builtin.blockinfile:
      path: "{{ ansible_env.HOME }}/.ssh/config"
      create: true
      mode: "0600"
      marker: "# {mark} ANSIBLE MANAGED: github"
      block: |
          Host github.com
              IdentityFile {{ secrets_ssh_key_dest }}

# Without this the first git@github.com clone fails host-key verification on a
# fresh target. ssh-keyscan runs on the controller; the key is the same globally.
- name: Trust the github.com host key
  ansible.builtin.known_hosts:
      path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
      name: github.com
      key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 github.com') }}"
      state: present
