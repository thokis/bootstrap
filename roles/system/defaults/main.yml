---
# Base packages every machine needs before the other roles clone and build.
# (SSH keys for the git@github.com fork clones are a separate manual prerequisite
# — pulled from Bitwarden onto the box, never committed.)
system_base_packages:
    - git
    - curl
    - ca-certificates
    - build-essential
    - pkg-config
    - unzip

# Default systemd target. multi-user is text-console only, so the display
# manager (only wanted by graphical.target) never starts on boot.
system_boot_target: multi-user.target

# Kernel cmdline tokens to strip from GRUB_CMDLINE_LINUX_DEFAULT for a plain
# text boot (no vendor splash, kernel messages visible).
system_grub_remove_params:
    - quiet
    - splash
