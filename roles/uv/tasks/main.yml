---
- name: Check whether uv is installed
  ansible.builtin.stat:
      path: "{{ uv_bin }}"
  register: uv_binary

- name: Download the uv installer
  ansible.builtin.get_url:
      url: "{{ uv_installer_url }}"
      dest: /tmp/uv-install.sh
      mode: "0755"
  when: not uv_binary.stat.exists

- name: Install uv
  ansible.builtin.command: sh /tmp/uv-install.sh
  args:
      creates: "{{ uv_bin }}"
  when: not uv_binary.stat.exists
