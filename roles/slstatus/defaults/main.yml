---
slstatus_repo: https://git.suckless.org/slstatus
slstatus_version: master
slstatus_src: "{{ ansible_facts.env.HOME }}/.sources/slstatus"
slstatus_bin: /usr/local/bin/slstatus

slstatus_build_packages:
    - build-essential
    - libx11-dev

# slstatus_battery is auto-detected from /sys/class/power_supply/BAT*; set it
# here or in host_vars to override. Empty = no battery component (desktops).
