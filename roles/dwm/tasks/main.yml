---
- name: Install build dependencies
  ansible.builtin.apt:
    name: "{{ dwm_build_packages }}"
    state: present
  become: true

- name: Check for an existing dwm checkout
  ansible.builtin.stat:
    path: "{{ dwm_src }}/.git"
  register: dwm_src_git

- name: Clone upstream dwm (pinned)
  ansible.builtin.git:
    repo: "{{ dwm_repo }}"
    dest: "{{ dwm_src }}"
    version: "{{ dwm_version }}"
  when: not dwm_src_git.stat.exists

- name: Apply the vendored patches
  ansible.posix.patch:
    src: "{{ item }}"
    basedir: "{{ dwm_src }}"
    strip: 1
  loop: "{{ dwm_patches }}"
  register: dwm_patch_result

- name: Deploy config.h
  ansible.builtin.copy:
    src: config.h
    dest: "{{ dwm_src }}/config.h"
    mode: "0644"
  register: dwm_config

- name: Check whether dwm is installed
  ansible.builtin.stat:
    path: "{{ dwm_bin }}"
  register: dwm_binary

- name: Build dwm
  community.general.make:
    chdir: "{{ dwm_src }}"
    target: all
  when: dwm_config.changed or dwm_patch_result.changed or not dwm_binary.stat.exists

- name: Install dwm
  community.general.make:
    chdir: "{{ dwm_src }}"
    target: install
  become: true
  when: dwm_config.changed or dwm_patch_result.changed or not dwm_binary.stat.exists
