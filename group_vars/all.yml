---
# Keyboard layout for both the tty console (LUKS prompt, login) and GNOME.
# Physical keyboards can't be auto-detected, so declare this per machine: give
# each host a stable inventory name and set it in host_vars/<host>.yml (NOT
# host_vars/localhost.yml — "localhost" matches whatever box you run on). This
# fleet default is US qwerty (desktops); German-qwertz notebooks set "de".
# One-off override: -e keyboard_layout=de.
keyboard_layout: us
